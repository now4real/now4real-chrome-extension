<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Now4real Everywhere</title>
    <link rel="stylesheet" href="settings.css">
  </head>
  <body class="popup-shell">
    <main class="panel">
      <header class="header">
        <img class="brand-icon" src="../icons/icon48.png" alt="" width="48" height="48">
        <div class="header-copy">
          <h1>Now4real</h1>
          <p id="widgetStateText">Widget disabled on all sites.</p>
        </div>
        <label class="switch header-switch" aria-label="Enable Now4real">
          <input id="now4realEnabled" type="checkbox">
          <span></span>
        </label>
      </header>

      <p id="loadWarning" class="load-warning" hidden></p>

      <section class="setting-group" aria-labelledby="position-title">
        <h2 id="position-title">Widget position</h2>
        <div class="segmented-control">
          <label>
            <input type="radio" name="widgetPosition" value="left">
            <span>Left</span>
          </label>
          <label>
            <input type="radio" name="widgetPosition" value="right">
            <span>Right</span>
          </label>
        </div>
      </section>

      <section class="setting-group demo-row">
        <div>
          <h2>Demo mode</h2>
          <p>When demo mode is on, you chat only with bots, and all counts, rankings, and maps are simulated. Turn it off to chat with other people using this extension on the same sites as you.</p>
        </div>
        <label class="switch" aria-label="Enable demo mode">
          <input id="demoMode" type="checkbox">
          <span></span>
        </label>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
